# Checks what this repository publishes: every lab has its README, its check configuration and (when graded)
# its expected output, the starters parse or compile, and the checker labs pass the site's checkers. The labs'
# reference solutions are not public, so graded labs are not run here; ./check <lab> runs them on your machine.
# Generated by the LearnSome.tech platform (scripts/labs-repos); do not edit here.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Structure, syntax and checkers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the lab sandbox's tools
        run: sudo sh .devcontainer/install-tools.sh ci
      - name: Lint the repository's own scripts
        run: |
          shellcheck check .devcontainer/install-tools.sh
          python3 -c 'import ast, sys; [ast.parse(open(f).read(), f) for f in sys.argv[1:]]' .learnsome/check.py .learnsome/grading.py
      - name: Check structure, starter syntax and checker labs
        run: ./check --lint --strict
